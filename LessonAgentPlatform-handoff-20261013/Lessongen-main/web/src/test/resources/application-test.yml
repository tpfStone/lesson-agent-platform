spring:
  datasource:
    url: jdbc:h2:mem:lesoongen;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/h2

app:
  storage-root: ./target/test-storage
  scheduling-enabled: false
  engine-internal-token: test-token
  security:
    enabled: false
    registration-enabled: true
    max-login-attempts: 3
    login-lock-minutes: 15
